<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACMS Assistant - Project Phoenix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #060911;
            --card-dark: #0d1322;
            --sidebar-bg: #080c18;
            --border-color: #1e293b;
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg-dark);
            position: relative;
        }

        /* ================= SIDEBAR (ثيم داكن مع إضاءة أحمر نيون) ================= */
        .sidebar {
            width: 270px;
            min-width: 270px;
            background: var(--sidebar-bg);
            color: var(--text-primary);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        .sidebar.collapsed {
            margin-left: -270px;
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            padding: 8px 10px 20px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .logo span {
            color: var(--accent-red);
        }

        .new-chat {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #7f1d1d;
            border-radius: 14px;
            background: linear-gradient(135deg, #2a1114 0%, #15080a 100%);
            color: #fca5a5;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
        }

        .new-chat:hover {
            background: linear-gradient(135deg, #3f171b 0%, #200a0d 100%);
            border-color: var(--accent-red);
            box-shadow: 0 0 18px var(--accent-red-glow);
            transform: translateY(-1px);
        }

        .section-title {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 0 10px 12px;
            text-transform: uppercase;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #111827;
            color: #ffffff;
            border-color: var(--border-color);
        }

        .history-item.active {
            background: #1e1b2e;
            color: #ffffff;
            border-color: #4338ca;
            font-weight: 600;
        }

        .history-icon {
            font-size: 14px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        /* ================= MAIN CHAT AREA ================= */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: radial-gradient(circle at 90% 10%, rgba(185, 28, 28, 0.08) 0%, var(--bg-dark) 60%);
            position: relative;
        }

        .header {
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(9, 14, 26, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-dark);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: #1a233a;
            border-color: #334155;
        }

        .assistant-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7f1d1d 0%, #3f090b 100%);
            border: 1px solid var(--accent-red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 12px var(--accent-red-glow);
        }

        .assistant-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .status {
            color: var(--text-secondary);
            font-size: 11.5px;
            margin-top: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        /* ================= CHAT MESSAGES ================= */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 0 150px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }

        .chat-container {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 0 24px;
        }

        .message {
            display: flex;
            width: 100%;
            margin-bottom: 22px;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 82%;
            width: fit-content !important;
        }

        .message.user .message-content {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            margin-top: 2px;
            font-weight: 700;
        }

        .bot-avatar-small {
            background: linear-gradient(135deg, #7f1d1d 0%, #200a0d 100%);
            border: 1px solid var(--accent-red);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .user-avatar {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .bubble {
            display: inline-block !important;
            width: fit-content !important;
            max-width: 100%;
            padding: 13px 18px !important;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 14.5px;
            word-break: break-word;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        /* فقاعة البوت بتصميم مظلم وإطار ناعم */
        .bot .bubble {
            background: var(--card-dark);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-top-left-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        /* فقاعة المستخدم متدرجة باللون الأحمر النارى المضيء */
        .user .bubble {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: #ffffff;
            border-top-right-radius: 6px;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.3);
        }

        #typingMessage .bubble {
            padding: 12px 16px !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
        }

        /* كارت الترحيب الرئيسي */
        .welcome {
            text-align: center;
            margin: 8vh auto 40px;
            max-width: 580px;
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .welcome::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
        }

        .welcome-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #7f1d1d 0%, #3f090b 100%);
            border: 1.5px solid var(--accent-red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            box-shadow: 0 0 20px var(--accent-red-glow);
        }

        .welcome h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .welcome h1 span {
            color: #f87171;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ================= INPUT BOX FLOATING ================= */
        .input-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 24px;
            background: linear-gradient(180deg, rgba(6, 9, 17, 0) 0%, var(--bg-dark) 50%);
        }

        .input-box {
            max-width: 820px;
            margin: auto;
            background: #0d1322;
            border: 1.5px solid var(--border-color);
            border-radius: 26px;
            display: flex;
            align-items: flex-end;
            padding: 8px 12px;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .input-box:focus-within {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-red-glow);
        }

        .message-input {
            flex: 1;
            background: transparent;
            color: var(--text-primary);
            border: none;
            outline: none;
            resize: none;
            min-height: 42px;
            max-height: 150px;
            padding: 10px 8px;
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.45;
        }

        .message-input::placeholder {
            color: #64748b;
        }

        .btn-icon {
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--accent-red);
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--accent-red-glow);
        }

        .btn-icon.circle {
            width: 40px;
        }

        .btn-icon.pill {
            font-size: 12px;
            font-weight: 700;
            padding: 0 14px;
            border-radius: 20px;
            background: #1e293b;
            color: #fca5a5;
            border: 1px solid #334155;
            box-shadow: none;
        }

        .btn-icon.pill:hover {
            background: #334155;
            color: #ffffff;
        }

        .btn-icon.circle:hover {
            background: #dc2626;
            transform: scale(1.05);
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.5);
        }

        .btn-icon:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .mic-button.listening {
            background: #ef4444;
            color: #ffffff;
            animation: pulse-red 1.2s infinite ease-in-out;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .disclaimer {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            margin-top: 10px;
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 4px 0;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }
    </style>
</head>

<body>

<div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">🛡️ MACMS <span>Assistant</span></div>
        <button class="new-chat" onclick="createNewChat()">
            <span>+</span> New Chat
        </button>
        <div class="section-title">RECENT CHATS</div>
        <div class="history-list" id="historyList">
            <!-- سيتم إنشاء العناصر ديناميكياً -->
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="main">
        <header class="header">
            <div class="header-left">
                <button class="toggle-btn" id="toggleSidebar" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
                <div class="assistant-info">
                    <div class="bot-avatar">🛡️</div>
                    <div>
                        <div class="assistant-name">MACMS AI Assistant</div>
                        <div class="status"><span class="status-dot"></span> System Active & Monitoring</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="messages" id="messages">
            <div class="chat-container" id="chatContainer">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🛡️</div>
                    <h1>MACMS <span>AI Assistant</span></h1>
                    <p>Ask me about fire detection alerts, sensor severity, evacuation procedures, or system status.</p>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="messageInput" class="message-input" placeholder="Ask MACMS anything..." rows="1"></textarea>
                <button id="langBtn" class="btn-icon pill" onclick="toggleLanguage()" title="Switch Language">AR</button>
                <button id="micButton" class="btn-icon circle mic-button" onclick="toggleDictation()" title="Speak to Type">🎙️</button>
                <button id="sendButton" class="btn-icon circle" onclick="sendMessage()">↑</button>
            </div>
            <div class="disclaimer">MACMS Assistant can make mistakes. Verify critical emergency information.</div>
        </div>
    </main>
</div>

<script>
let recognition = null;
let isListening = false;
let currentLang = 'ar-EG';

let chats = [];
let currentChatId = null;

function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    sidebar.classList.toggle("collapsed");
}

/* ================= إدارة المحادثات السابقة ================= */
function createNewChat() {
    currentChatId = null;
    const container = document.getElementById("chatContainer");
    container.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-icon">🛡️</div>
            <h1>MACMS <span>AI Assistant</span></h1>
            <p>Ask me about fire detection alerts, sensor severity, evacuation procedures, or system status.</p>
        </div>
    `;
    renderSidebar();
    document.getElementById("messageInput").value = "";
    document.getElementById("messageInput").focus();
}

function renderSidebar() {
    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
        item.title = chat.title;
        item.innerHTML = `<span class="history-icon">💬</span> ${escapeHTML(chat.title)}`;
        item.onclick = () => loadChat(chat.id);
        historyList.appendChild(item);
    });
}

function loadChat(chatId) {
    const chat = chats.find(c => c.id === chatId);
    if (!chat) return;

    currentChatId = chatId;
    renderSidebar();

    const container = document.getElementById("chatContainer");
    container.innerHTML = "";

    chat.messages.forEach(msg => {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${msg.role}`;
        msgDiv.innerHTML = `
            <div class="message-content">
                <div class="message-avatar ${msg.role === 'user' ? 'user-avatar' : 'bot-avatar-small'}">
                    ${msg.role === 'user' ? 'U' : '🛡️'}
                </div>
                <div class="bubble">${escapeHTML(msg.text)}</div>
            </div>
        `;
        container.appendChild(msgDiv);
    });

    scrollToBottom();
}

/* ================= الصوت والتحدث ================= */
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = currentLang;

    recognition.onresult = function(event) {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
        }
        
        const input = document.getElementById("messageInput");
        if (transcript.trim() !== "") {
            input.value = transcript;
            autoResize();
        }
    };

    recognition.onerror = function(event) {
        console.error("Speech Error:", event.error);
        if (event.error === 'not-allowed') {
            alert("❌ الميكروفون محظور! يرجى إعطاء الصلاحية من إعدادات المتصفح.");
        } else if (event.error === 'network') {
            alert("❌ يرجى التأكد من توصيل النت لعمل تحويل الصوت اللحظي.");
        }
        stopListening();
    };

    recognition.onend = function() {
        if (isListening) {
            try {
                recognition.start();
            } catch(e) {}
        } else {
            stopListening();
        }
    };
}

function toggleLanguage() {
    const langBtn = document.getElementById("langBtn");
    if (isListening && recognition) {
        recognition.stop();
        stopListening();
    }
    if (currentLang === 'en-US') {
        currentLang = 'ar-EG';
        langBtn.innerText = 'AR';
    } else {
        currentLang = 'en-US';
        langBtn.innerText = 'EN';
    }
    if (recognition) {
        recognition.lang = currentLang;
    }
}

function toggleDictation() {
    if (!recognition) {
        alert("خاصية الكتابة اللحظية تعمل على متصفح Google Chrome أو Microsoft Edge.");
        return;
    }

    if (!isListening) {
        try {
            isListening = true;
            recognition.lang = currentLang;
            recognition.start();
            
            const micButton = document.getElementById("micButton");
            micButton.classList.add("listening");
            micButton.innerHTML = "⏹️";
            const promptMsg = currentLang === 'ar-EG' ? "اتكلم دلوقتي، الكلام هيكتب فوراً..." : "Speak now, typing live...";
            document.getElementById("messageInput").placeholder = promptMsg;
        } catch (e) {
            console.error(e);
            stopListening();
        }
    } else {
        isListening = false;
        recognition.stop();
        stopListening();
    }
}

function stopListening() {
    isListening = false;
    const micButton = document.getElementById("micButton");
    if (micButton) {
        micButton.classList.remove("listening");
        micButton.innerHTML = "🎙️";
    }
    const input = document.getElementById("messageInput");
    if (input) {
        input.placeholder = "Ask MACMS anything...";
    }
}

/* ================= إرسال الرسائل ================= */
async function sendMessage() {
    if (isListening && recognition) {
        isListening = false;
        recognition.stop();
        stopListening();
    }

    const input = document.getElementById("messageInput");
    const container = document.getElementById("chatContainer");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");
    const text = input.value.trim();

    if (text === "") return;

    if (welcome) welcome.remove();

    if (currentChatId === null) {
        currentChatId = Date.now();
        const newTitle = text.length > 25 ? text.substring(0, 25) + "..." : text;
        chats.unshift({
            id: currentChatId,
            title: newTitle,
            messages: []
        });
        renderSidebar();
    }

    const currentChat = chats.find(c => c.id === currentChatId);
    if (currentChat) {
        currentChat.messages.push({ role: "user", text: text });
    }

    sendButton.disabled = true;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.innerHTML = `
        <div class="message-content">
            <div class="message-avatar user-avatar">U</div>
            <div class="bubble">${escapeHTML(text)}</div>
        </div>
    `;
    container.appendChild(userMessage);

    input.value = "";
    autoResize();
    scrollToBottom();

    const typingMessage = document.createElement("div");
    typingMessage.className = "message bot";
    typingMessage.id = "typingMessage";
    typingMessage.innerHTML = `
        <div class="message-content">
            <div class="message-avatar bot-avatar-small">🛡️</div>
            <div class="bubble">
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    `;
    container.appendChild(typingMessage);
    scrollToBottom();

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();
        typingMessage.remove();

        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.innerHTML = `
            <div class="message-content">
                <div class="message-avatar bot-avatar-small">🛡️</div>
                <div class="bubble">${escapeHTML(data.response)}</div>
            </div>
        `;
        container.appendChild(botMessage);

        if (currentChat) {
            currentChat.messages.push({ role: "bot", text: data.response });
        }

        scrollToBottom();

    } catch (error) {
        typingMessage.remove();
        const errorMessage = document.createElement("div");
        errorMessage.className = "message bot";
        errorMessage.innerHTML = `
            <div class="message-content">
                <div class="message-avatar bot-avatar-small">🛡️</div>
                <div class="bubble">❌ I couldn't connect to the MACMS server.</div>
            </div>
        `;
        container.appendChild(errorMessage);
        scrollToBottom();
        console.error(error);
    }

    sendButton.disabled = false;
    input.focus();
}

document.getElementById("messageInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

document.getElementById("messageInput").addEventListener("input", autoResize);

function autoResize() {
    const input = document.getElementById("messageInput");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

function scrollToBottom() {
    const messages = document.getElementById("messages");
    messages.scrollTop = messages.scrollHeight;
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
